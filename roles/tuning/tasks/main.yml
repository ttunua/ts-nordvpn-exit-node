# Tailscale's recommendation for Linux exit nodes: batch forwarded UDP to cut per-packet CPU.
- name: Install ethtool
  ansible.builtin.apt:
    name: ethtool

- name: Install the GRO unit
  ansible.builtin.template:
    src: udp-gro-forwarding.service.j2
    dest: /etc/systemd/system/udp-gro-forwarding.service
    mode: "0644"
  notify: Restart udp-gro-forwarding

- name: Enable and start it
  ansible.builtin.systemd_service:
    name: udp-gro-forwarding
    enabled: true
    state: started
    daemon_reload: true
